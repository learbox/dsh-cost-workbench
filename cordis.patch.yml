# dsh-cost-workbench：会话右侧栏的造价工作台，事实源是 Obsidian vault 里的笔记。
# 本行插在 profile 的 bundle 层；用户可用自己的 patch 层按 id 覆盖 config（覆盖是整段替换）。
- insert:
    - id: dsh-cost-workbench
      name: 'dsh-cost-workbench'
      config:
        # Obsidian vault 根目录（建议专用的造价库）；首次打开面板时会引导填写。
        vaultRoot: ""
        # 资料库子目录：工作台列/读/写这里的 md 笔记（计价依据、招投标流程、合同范本、常用模板）。
        sopDir: "00 资料库"
        # 工作台自己的笔记（术语表、三张表）放这里，Obsidian 里同样可见可改。
        workbenchDir: "Workbench"
        # cards.json / prompts.json 留在本机工作区（不是笔记）。留空则用 ~/.dsh-workbench
        dataDir: ""
        # 会议记录：录音与转写稿落在 vault 的这个目录下。
        recordingsDir: "会议记录"
        # ASR 凭据文件（火山引擎 apiKey 等），默认在 dataDir 下；600 权限，不进仓库。
        asrConfigFile: ""
        # 打开 Obsidian / 外部网页用的命令；留空 = 按平台自动（Windows: cmd /c start）
        openCommand: ""
        # 文件夹选择器命令；留空 = 按平台自动（Windows: PowerShell 文件夹选择框）
        folderPickerCommand: ""
